name: Test pip cache

on:
  # push:
  #   branches:
  #     - test-973
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, windows-latest, windows-2019, macos-13, macos-latest]
        # os: [windows-2025, windows-latest, windows-2019, windows-11-arm]
        # python-version: ['3.13.1t', '3.13.1', '3.12', '3.11', '3.10']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        # uses: actions/setup-python@v5
        uses: lmvysakh/setup-python@enhance-python-version-readability
        with:
          python-version-file: '.python-version' 
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Verify Python Version
        run: |
            python --version



