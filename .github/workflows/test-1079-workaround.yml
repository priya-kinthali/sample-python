name: Test 1079 with fix

on:
  push:
    branches:
      - test-973
  workflow_dispatch:
jobs:
  test-multiple-python:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13.3
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.3

      - name: Create python3.13 alias for Windows
        shell: pwsh
        run: |
          $pythonPath = "${env:pythonLocation}\\python.exe"
          $aliasDir = "$env:USERPROFILE\\bin"
          New-Item -ItemType Directory -Force -Path $aliasDir
          $aliasPath = "$aliasDir\\python3.13.bat"
          $batchContent = @"
          @echo off
          "$pythonPath" %*
          "@
          Set-Content -Path $aliasPath -Value $batchContent
          echo "$aliasDir" >> $env:GITHUB_PATH
      - name: Check available python executables
        shell: pwsh
        run: |
          echo "Checking python executables"
          which python
          which python3
          which python3.13 || echo "python3.13 not found"
          python --version
          python3 --version
      - name: Try calling python3.13
        shell: pwsh
        run: |
          python3.13 --version || echo "python3.13 not callable"
          python3.13 hello.py || echo "Failed to run hello.py with python3.13"
