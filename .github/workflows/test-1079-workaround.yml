name: Test 1079 with fix

on:
  push:
    branches:
      - test-973
  workflow_dispatch:
jobs:
  test-python-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.9
        id: setup-python-3-9
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Capture Python 3.9 path
        run: echo "Python 3.9 path ${{ steps.setup-python-3-9.outputs.python-path }}"
      - name: Set up Python 3.13
        id: setup-python-3-13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Capture Python 3.13 path
        run: echo "Python 3.13 path ${{ steps.setup-python-3-13.outputs.python-path }}"

      # Step 4: Use both versions in your CI workflow
      - name: Run tests with Python 3.9
        run: |
          ${{ steps.setup-python-3-9.outputs.python-path }} --version
          ${{ steps.setup-python-3-9.outputs.python-path }} hello.py

      - name: Run tests with Python 3.13
        run: |
          ${{ steps.setup-python-3-13.outputs.python-path }} --version
          ${{ steps.setup-python-3-13.outputs.python-path }} hello.py

     