name: Test Python Versions
        
on:
  # push:
  #   branches:
  #     - test-973
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # os: [windows-latest, windows-11-arm, ubuntu-latest, macos-15-intel, macos-latest, ubuntu-22.04-arm]
        os: [ubuntu-22.04-arm]
        python-version: [
          '3.15.0-alpha.3', '3.15.0-alpha.4', '3.15.0-alpha.5', '3.15.0-alpha.6'
        ]
       
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      # uses: actions/setup-python@v6
      uses: priya-kinthali/setup-python@test-1079
      with:
          python-version: ${{ matrix.python-version }}
          freethreaded: true
    - name: Check Python version
      run: python3 --version


