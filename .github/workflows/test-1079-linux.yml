name: Test 1079

on:
  push:
    branches:
      - test-973
  workflow_dispatch:

jobs:
  test-python-executables:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        # architecture: [x86, x64]

      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.8
            3.9
            3.10
          # architecture: ${{ matrix.architecture }}
      - name: Check for Python 3.8.18 files (Linux)
        shell: bash
        run: |
          echo "Checking Python 3.8.18 files on Linux..."
          ls -lR /opt/hostedtoolcache/Python/3.8.18
      - name: Check for Python 3.9.22 files (Linux)
        shell: bash
        run: |
          echo "Checking Python 3.9.22 files on Linux..."
          ls -lR /opt/hostedtoolcache/Python/3.9.2