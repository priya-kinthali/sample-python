name: Test 1309

on:
  push:
    branches:
      - test-973
  workflow_dispatch:

jobs:
  latest-latest-in-practice-26-on-host-and-in-container:
    runs-on: ubuntu-latest
    container: ubuntu:latest
    steps:
      - name: Show host / container info
        run: |
          echo "=== /etc/os-release ==="
          cat /etc/os-release || true
          echo "=== uname -a ==="
          uname -a
          echo "=== whoami ==="
          whoami
          echo "=== RUNNER_OS / RUNNER_ARCH ==="
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"


      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify Python
        run: |
          which python
          python --version
          python -c "import sys, platform; print(sys.executable); print(platform.platform())"

  test-26-on-host-and-24-in-container:
    runs-on: [self-hosted]
    container: ubuntu:24.04
    steps:
      - name: Show host / container info
        run: |
          echo "=== /etc/os-release ==="
          cat /etc/os-release || true
          echo "=== uname -a ==="
          uname -a
          echo "=== whoami ==="
          whoami
          echo "=== RUNNER_OS / RUNNER_ARCH ==="
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify Python
        run: |
          which python
          python --version
          python -c "import sys, platform; print(sys.executable); print(platform.platform())"
