# .github/workflows/test-python-versions.yml
name: Test Python patch Versions cached 

on:
  # push:
  #   branches:
  #     - test-973
  workflow_dispatch:

jobs:
  test-multiple-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.8.7
        uses: priya-kinthali/setup-python@test-1079
        with:
          python-version: |
            3.8.7
      
      - name: Check available python executables
        shell: bash
        run: |
          echo "Checking python executables"
          which python
          which python3
          which python3.8 || echo "python3.8 not found"
          command -v python3.8 || echo "python3.8 not found"
          echo "Python version:"
          python --version
          python3 --version

      - name: Try calling python3.8
        shell: bash
        run: |
          python3.8 --version || echo "python3.8 not callable"
          python3.8 hello.py || echo "Failed to run hello.py with python3.8"



