# .github/workflows/test-python-versions.yml
name: Test Python patch Versions uncached freethread

on:
  push:
    branches:
      - test-973
  workflow_dispatch:

jobs:
  test-multiple-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13 windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13t 
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.13.2t
            3.13.1
            3.12.8
            3.11.8
            3.10.10
            3.9.12

      - name: Check available python executables
        shell: bash
        run: |
          echo "Checking python executables"
          which python
          which python3
          which python3.13.2t || echo "python3.13.2t not found"
          which python3.13.1 || echo "python3.13.1 not found"
          which python3.12.8 || echo "python3.12.8 not found"
          which python3.11.8 || echo "python3.11.8 not found"
          which python3.10.10 || echo "python3.10.10 not found"
          which python3.9.12 || echo "python3.9.12 not found"
          command -v python || echo "python not found"
          python3.13.2t -VV || echo "python 3.13.2t not found"
          command -v python3.13.1 || echo "python3.13.1 not found"
          command -v python3.12.8 || echo "python3.12.8 not found"
          command -v python3.11.8 || echo "python3.11.8 not found"
          command -v python3.10.10 || echo "python3.10.10 not found"
          command -v python3.9.12 || echo "python3.9.12 not found"
          echo "Python version:"
          python --version

      - name: Try calling python3.13.2t
        shell: bash
        run: |
          python3.13.2t -VV || echo "python3.13.2t not callable"

      - name: Try calling python3.13.1
        shell: bash
        run: |
          python3.13.1 --version || echo "python3.13.1 not callable"
      - name: Try calling python3.12.8
        shell: bash
        run: |
          python3.12.8 --version || echo "python3.12.8 not callable"
      - name: Try calling python3.11.8
        shell: bash
        run: |
          python3.11.8 --version || echo "python3.11.8 not callable"
      - name: Try calling python3.10.10
        shell: bash
        run: |
          python3.10.10 --version || echo "python3.10.10 not callable"
      - name: Try calling python3.9.12
        shell: bash
        run: |
          python3.9.12 --version || echo "python3.9.12 not callable"

