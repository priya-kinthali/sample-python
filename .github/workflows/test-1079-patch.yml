# .github/workflows/test-python-versions.yml
name: Test Python patch Versions uncached freethread

on:
  push:
    branches:
      - test-973
  workflow_dispatch:

jobs:
  test-multiple-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13t 
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.13.2t
            3.13.1
            3.12.1
            3.11.1
            3.10.1
            3.9.1
            3.8.1

      - name: Check available python executables
        shell: bash
        run: |
          echo "Checking python executables"
          which python
          which python3
          which python3.13.2t || echo "python3.13.2t not found"
          which python3.13.1 || echo "python3.13.1 not found"
          which python3.12.1 || echo "python3.12.1 not found"
          which python3.11.1 || echo "python3.11.1 not found"
          which python3.10.1 || echo "python3.10.1 not found"
          which python3.9.1 || echo "python3.9.1 not found"
          which python3.8.1 || echo "python3.8.1 not found"
          command -v python || echo "python not found"
          python3.13.2t -VV || echo "python 3.13.2t not found"
          command -v python3.13.1 || echo "python3.13.1 not found"
          command -v python3.12.1 || echo "python3.12.1 not found"
          command -v python3.11.1 || echo "python3.11.1 not found"
          command -v python3.10.1 || echo "python3.10.1 not found"
          command -v python3.9.1 || echo "python3.9.1 not found"
          command -v python3.8.1 || echo "python3.8.1 not found"
          echo "Python version:"
          python --version

      - name: Try calling python3.13.2t
        shell: bash
        run: |
          python3.13.2t -VV || echo "python3.13.2t not callable"

      - name: Try calling python3.13.1
        shell: bash
        run: |
          python3.13.1 --version || echo "python3.13.1 not callable"
      - name: Try calling python3.12.1
        shell: bash
        run: |
          python3.12.1 --version || echo "python3.12.1 not callable"
      - name: Try calling python3.11.1
        shell: bash
        run: |
          python3.11.1 --version || echo "python3.11.1 not callable"
      - name: Try calling python3.10.1
        shell: bash
        run: |
          python3.10.1 --version || echo "python3.10.1 not callable"
      - name: Try calling python3.9.1
        shell: bash
        run: |
          python3.9.1 --version || echo "python3.9.1 not callable"
      - name: Try calling python3.8.1
        shell: bash
        run: |
          python3.8.1 --version || echo "python3.8.1 not callable"
