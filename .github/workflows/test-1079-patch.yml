# .github/workflows/test-python-versions.yml
name: Test Python patch Versions cached freethread

on:
  # push:
  #   branches:
  #     - test-973
  workflow_dispatch:

jobs:
  test-multiple-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13t 
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.13.2t
            3.13.3
            3.12.10
            3.11.12
            3.10.17
            3.9.22

      - name: Check available python executables
        shell: bash
        run: |
          echo "Checking python executables"
          which python
          which python3
          which python3.13.2t || echo "python3.13.2t not found"
          which python3.13.3 || echo "python3.13.3 not found"
          which python3.12.10 || echo "python3.12.10 not found"
          which python3.11.12 || echo "python3.11.12 not found"
          which python3.10.17 || echo "python3.10.17 not found"
          which python3.9.22 || echo "python3.9.22 not found"
          command -v python || echo "python not found"
          python3.13.2t -VV || echo "python 3.13.2t not found"
          command -v python3.13.3 || echo "python3.13.3 not found"
          command -v python3.12.10 || echo "python3.12.10 not found"
          command -v python3.11.12 || echo "python3.11.12 not found"
          command -v python3.10.17 || echo "python3.10.17 not found"
          command -v python3.9.22 || echo "python3.9.22 not found"
          echo "Python version:"
          python --version

      - name: Try calling python3.13.2t
        shell: bash
        run: |
          python3.13.2t -VV || echo "python3.13.2t not callable"

      - name: Try calling python3.13.3
        shell: bash
        run: |
          python3.13.3 --version || echo "python3.13.3 not callable"
      - name: Try calling python3.12.10
        shell: bash
        run: |
          python3.12.10 --version || echo "python3.12.10 not callable"
      - name: Try calling python3.11.12
        shell: bash
        run: |
          python3.11.12 --version || echo "python3.11.12 not callable"
      - name: Try calling python3.10.17
        shell: bash
        run: |
          python3.10.17 --version || echo "python3.10.17 not callable"
      - name: Try calling python3.9.22
        shell: bash
        run: |
          python3.9.22 --version || echo "python3.9.22 not callable"

