name: Setting up both python 3.14 and 3.14t on windows arm

on:
  push:
    branches:
      - test-973
  workflow_dispatch:

jobs:
  test-multiple-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Clear Python cache on runner
        shell: bash
        run: |
          echo "Clearing Python cache..."
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            rm -rf ~/.cache/pip ~/.local/share/python
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            rm -rf ~/Library/Caches/pip ~/.local/share/python
          fi

      - name: Clear Python cache on Windows runner
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          Write-Host "Clearing Python cache..."
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\pip\Cache" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:APPDATA\Python" -ErrorAction SilentlyContinue
      - name: Setup Python 3.14 and 3.14t
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
      - name: Verify Python installation
        shell: bash
        run: |
          echo "Python version:"
          python --version
          echo ""
          echo "Python executable location:"
          which python
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')"