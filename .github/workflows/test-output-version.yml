name: Outputs

on:
  push:
    branches:
      - test-973
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, windows-latest, windows-2019, macos-13, macos-latest]
        # python-version: ['3.13.1t', '3.13.1', '3.12', '3.11', '3.10']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python
        # uses: actions/setup-python@v5
        uses: lmvysakh/setup-python@enhance-python-version-readability
        id: cp312
        with:
          python-version-file: '.python-version' 

      # - run: echo '${{ steps.cp312.outputs.cache-hit }}' # true if cache-hit occurred on the primary key
      # - run: echo '${{ steps.cp312.outputs.python-version }}'
      # - run: echo '${{ steps.cp312.outputs.python-version }}'
      - run: pipx run --python '${{ steps.cp312.outputs.python-path }}' nox --version
      - name: Verify Python Version
        run: |
          python --version
          



