name: Test Python 3.8 Install without Rosetta

on:
  push:
    branches:
      - test-973
  workflow_dispatch:

jobs:
  test-python38:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Print macOS and Architecture Info
        run: |
          echo "Runner Architecture: $(uname -m)"
          echo "CPU Info: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo 'Not available on Apple Silicon (arm64)')"
          echo "macOS Version:"
          sw_vers
      - name: Check if Rosetta is installed
        run: |
          if pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
            echo "Rosetta is installed"
            pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto
          else
            echo "Rosetta is NOT installed"
          fi

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          # architecture: 'arm64'

      - name: Check Python version
        run: python3 --version

      - name: Dump architecture-related env vars
        run: |
          echo "ARCHFLAGS=$ARCHFLAGS"
          echo "SDKROOT=$SDKROOT"
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          echo "CFLAGS=$CFLAGS"
          echo "LDFLAGS=$LDFLAGS"
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "PYTHONPATH=$PYTHONPATH"
          echo "Python sys.platform: $(python3 -c 'import sys; print(sys.platform)')"
          echo "Python machine arch: $(python3 -c 'import platform; print(platform.machine())')"
